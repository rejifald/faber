  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="400" rx="24" fill="url(#tex)" mask="url(#vig)"/>
  <use href="#mark" transform="translate(73.6 64.0) scale(1.0667)"/>
  <text x="177.8" y="145.8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2.67" fill="#FAFAFA">faber</text>
  <text x="96" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#FAFAFA" fill-opacity="0.82">Your own CI runners, on your own hardware.</text>
  <line x1="96" y1="250.5" x2="1184" y2="250.5" stroke="#FAFAFA" stroke-opacity="0.12"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#FAFAFA">
    <use href="#i-bolt" transform="translate(96.0 281.9) scale(0.9545)"/>
    <text x="128.5" y="300" font-size="21" font-weight="600">Faster jobs</text>
    <text x="96.0" y="328" font-size="15" fill-opacity="0.6">npm and git served from local mirrors</text>
    <use href="#i-cache" transform="translate(368.0 281.9) scale(0.9545)"/>
    <text x="400.5" y="300" font-size="21" font-weight="600">Service containers</text>
    <text x="368.0" y="328" font-size="15" fill-opacity="0.6">Postgres, Redis or any image</text>
    <use href="#i-cube" transform="translate(640.0 281.9) scale(0.9545)"/>
    <text x="672.5" y="300" font-size="21" font-weight="600">Isolated</text>
    <text x="640.0" y="328" font-size="15" fill-opacity="0.6">A fresh runner for every job</text>
    <use href="#i-shield" transform="translate(912.0 281.9) scale(0.9545)"/>
    <text x="944.5" y="300" font-size="21" font-weight="600">Trust-gated</text>
    <text x="912.0" y="328" font-size="15" fill-opacity="0.6">Code from strangers never runs</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" fill="none" stroke="url(#rim)"/>
