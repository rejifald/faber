<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="faber: your own CI runners, on your own hardware. Faster jobs, service containers, isolated, trust-gated.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B211C"/><stop offset="1" stop-color="#15100D"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="0.4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="940" cy="460" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E46B2B" stop-opacity="0.34"/><stop offset="1" stop-color="#E46B2B" stop-opacity="0"/></radialGradient>
    <pattern id="tex" width="48" height="72" patternUnits="userSpaceOnUse" patternTransform="scale(1.3333)"><polygon points="24,0 48,12 24,24 0,12" fill="#F7955A" fill-opacity="0.09"/><polygon points="0,12 24,24 24,48 0,36" fill="#EFE4D6" fill-opacity="0.053"/><polygon points="48,12 24,24 24,48 48,36" fill="#EFE4D6" fill-opacity="0.022"/><polygon points="48,36 72,48 48,60 24,48" fill="#F7955A" fill-opacity="0.09"/><polygon points="24,48 48,60 48,84 24,72" fill="#EFE4D6" fill-opacity="0.053"/><polygon points="72,48 48,60 48,84 72,72" fill="#EFE4D6" fill-opacity="0.022"/><polygon points="0,36 24,48 0,60 -24,48" fill="#F7955A" fill-opacity="0.09"/><polygon points="-24,48 0,60 0,84 -24,72" fill="#EFE4D6" fill-opacity="0.053"/><polygon points="24,48 0,60 0,84 24,72" fill="#EFE4D6" fill-opacity="0.022"/><polygon points="48,-36 72,-24 48,-12 24,-24" fill="#F7955A" fill-opacity="0.09"/><polygon points="24,-24 48,-12 48,12 24,0" fill="#EFE4D6" fill-opacity="0.053"/><polygon points="72,-24 48,-12 48,12 72,0" fill="#EFE4D6" fill-opacity="0.022"/><polygon points="0,-36 24,-24 0,-12 -24,-24" fill="#F7955A" fill-opacity="0.09"/><polygon points="-24,-24 0,-12 0,12 -24,0" fill="#EFE4D6" fill-opacity="0.053"/><polygon points="24,-24 0,-12 0,12 24,0" fill="#EFE4D6" fill-opacity="0.022"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="vig"><rect width="1280" height="400" fill="url(#fade)"/></mask>
    <g id="mark">
      <polygon points="50,21 79,35.5 67.854,41.073 50,32.146 32.146,41.073 21,35.5" fill="#EFE4D6" fill-opacity="0.95"/>
      <polygon points="21,64.5 50,79 50,67.854 32.5,59.104 32.5,41.25 21,35.5" fill="#EFE4D6" fill-opacity="0.7"/>
      <polygon points="79,64.5 50,79 50,67.854 67.5,59.104 67.5,41.25 79,35.5" fill="#EFE4D6" fill-opacity="0.45"/>
      <polygon points="50,35.5 64.5,42.75 50,50 35.5,42.75" fill="#F7955A"/>
      <polygon points="35.5,57.25 50,64.5 50,50 35.5,42.75" fill="#E46B2B"/>
      <polygon points="64.5,57.25 50,64.5 50,50 64.5,42.75" fill="#B9521C"/>
    </g>
    <g id="i-bolt" fill="none" stroke="#F7955A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
    <g id="i-cache" fill="none" stroke="#F7955A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></g>
    <g id="i-cube" fill="none" stroke="#F7955A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></g>
    <g id="i-shield" fill="none" stroke="#F7955A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></g>
