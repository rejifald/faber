[package]
name = "faber-menubar"
# Stamped by .github/workflows/release.yml at release time, never committed;
# see the root Cargo.toml.
version = "0.3.12"
description = "faber menu-bar app — live status of the local JIT runner daemon"
authors = ["Oleksandr Zhuravlov"]
edition = "2021"
# The repository's license, as in the root Cargo.toml. Without one cargo-deny reads
# the app as unlicensed.
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "faber_menubar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
# Release verification shared with the daemon (ADR-0031, ADR-0034).
faber-release = { path = "../../crates/faber-release" }

[features]
# Forwarded to `faber-release`: swaps in the sandbox repository's verification
# policy for end-to-end tests. Never on by default.
sandbox-policy = ["faber-release/sandbox-policy"]

# Its own workspace root: a worktree nested inside another checkout would otherwise fail to build.
[workspace]
